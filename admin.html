<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mentoria Medicina - Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f7;
            color: #17202a;
        }

        header {
            background: #173f5f;
            color: white;
            padding: 18px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            text-align: center;
        }

        header p {
            text-align: center;
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            max-width: 850px;
            margin: auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }

        .view-btn {
            background: #173f5f;
            color: white;
            width: 100%;
        }

        .pdf-btn {
            background: #2e8b57;
            color: white;
        }

        .logout-btn {
            background: #d9534f;
            color: white;
            float: right;
            margin-top: -34px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat {
            background: #f7f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            display: block;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .absent-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 13px 5px;
            border-bottom: 1px solid #eee;
        }

        .student-name {
            font-weight: bold;
        }

        .time {
            color: #777;
            font-size: 13px;
        }

        .message {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        .error {
            color: #d9534f;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .filters {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .absent-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Mentoria Medicina</h1>
    <p>Admin Attendance Dashboard</p>
</header>

<div class="container">

    <!-- Admin information -->
    <section class="card">
        <strong>Admin:</strong>
        <span id="adminEmail">Checking...</span>

        <button class="logout-btn" id="logoutBtn">
            Logout
        </button>
    </section>

    <!-- Filters -->
    <section class="card">

        <h2>Attendance Report</h2>

        <div class="filters">

            <div>
                <label for="groupSelect">
                    Group
                </label>

                <select id="groupSelect">
                    <option value="">Select Group</option>
                    <option value="7">Group 7</option>
                    <option value="9">Group 9</option>
                    <option value="10">Group 10</option>
                    <option value="11">Group 11</option>
                    <option value="12">Group 12</option>
                    <option value="13">Group 13</option>
                    <option value="15">Group 15</option>
                </select>
            </div>

            <div>
                <label for="dateSelect">
                    Date
                </label>

                <input
                    type="date"
                    id="dateSelect"
                >
            </div>

        </div>

        <button
            class="view-btn"
            id="viewBtn">
            View Attendance
        </button>

    </section>

    <!-- Statistics -->
    <section class="card">

        <div class="stats">

            <div class="stat">
                <span
                    class="stat-number"
                    id="totalStudents">
                    0
                </span>

                Total Students
            </div>

            <div class="stat">
                <span
                    class="stat-number"
                    id="absentCount">
                    0
                </span>

                Absent
            </div>

            <div class="stat">
                <span
                    class="stat-number"
                    id="presentCount">
                    0
                </span>

                Present
            </div>

        </div>

    </section>

    <!-- Absent list -->
    <section class="card">

        <h2>Absent Students</h2>

        <div id="absentList">

            <div class="message">
                Select group and date.
            </div>

        </div>

        <button
            class="pdf-btn"
            id="pdfBtn">
            Generate PDF
        </button>

    </section>

</div>


<script type="module">

    /* ==============================
       FIREBASE
    ============================== */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    import {
        getFirestore,
        collection,
        getDocs
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


    /* ==============================
       FIREBASE CONFIG
    ============================== */

    const firebaseConfig = {

        apiKey:
        "AIzaSyBPag4SLUqmdfAws0WFLV7FWp3X8_eLPQ",

        authDomain:
        "mentoria-medicina-attend-7d5ca.firebaseapp.com",

        projectId:
        "mentoria-medicina-attend-7d5ca",

        storageBucket:
        "mentoria-medicina-attend-7d5ca.firebasestorage.app",

        messagingSenderId:
        "238479536134",

        appId:
        "1:238479536134:web:3ff9a57dc1cb70dc8c9387",

        measurementId:
        "G-WEVCZ0JG2K"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* ==============================
       ELEMENTS
    ============================== */

    const adminEmail =
        document.getElementById("adminEmail");

    const groupSelect =
        document.getElementById("groupSelect");

    const dateSelect =
        document.getElementById("dateSelect");

    const viewBtn =
        document.getElementById("viewBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const absentList =
        document.getElementById("absentList");

    const totalStudents =
        document.getElementById("totalStudents");

    const absentCount =
        document.getElementById("absentCount");

    const presentCount =
        document.getElementById("presentCount");


    /* ==============================
       ADMIN LOGIN CHECK
    ============================== */

    onAuthStateChanged(auth, async (user) => {

        if (!user) {

            alert("Please login as Admin.");

            window.location.href =
                "index.html";

            return;
        }

        adminEmail.textContent =
            user.email;

        console.log(
            "Logged in Admin:",
            user.uid
        );

        /*
          IMPORTANT:

          Later we will check:

          admins/{user.uid}

          to confirm that this
          account is actually an admin.
        */
    });


    /* ==============================
       LOGOUT
    ============================== */

    logoutBtn.addEventListener(
        "click",
        async () => {

            await signOut(auth);

            window.location.href =
                "index.html";
        }
    );


    /* ==============================
       VIEW ATTENDANCE
    ============================== */

    viewBtn.addEventListener(
        "click",
        async () => {

            const group =
                groupSelect.value;

            const date =
                dateSelect.value;


            if (!group || !date) {

                alert(
                    "Please select group and date."
                );

                return;
            }


            absentList.innerHTML =
                `<div class="message">
                    Loading...
                 </div>`;


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "attendance"
                        )
                    );


                let records = [];


                snapshot.forEach((doc) => {

                    const data =
                        doc.data();


                    /*
                       Expected Firebase data:

                       group
                       studentName
                       submittedAt
                       date
                    */

                    if (
                        String(data.group) ===
                        String(group)
                        &&
                        data.date === date
                    ) {

                        records.push(data);
                    }

                });


                showAttendance(records);

            } catch (error) {

                console.error(error);

                absentList.innerHTML =
                    `<div class="message error">
                        Unable to load attendance.
                        <br>
                        ${error.message}
                     </div>`;
            }

        }
    );


    /* ==============================
       DISPLAY ATTENDANCE
    ============================== */

    function showAttendance(records) {

        absentCount.textContent =
            records.length;


        if (records.length === 0) {

            absentList.innerHTML =
                `<div class="message">
                    No absences found.
                 </div>`;

            presentCount.textContent =
                "0";

            return;
        }


        absentList.innerHTML = "";


        records.forEach((student, index) => {

            const item =
                document.createElement("div");

            item.className =
                "absent-item";


            let time = "";


            if (student.submittedAt) {

                if (
                    typeof student.submittedAt
                    .toDate === "function"
                ) {

                    time =
                        student.submittedAt
                        .toDate()
                        .toLocaleTimeString();
                }
            }


            item.innerHTML = `

                <div>

                    <div class="student-name">

                        ${index + 1}.
                        ${student.studentName || "Unknown"}

                    </div>

                    <div class="time">

                        ${time}

                    </div>

                </div>

                <strong>
                    ABSENT
                </strong>

            `;


            absentList.appendChild(item);

        });

    }


    /* ==============================
       PDF BUTTON
    ============================== */

    document.getElementById(
        "pdfBtn"
    ).addEventListener(
        "click",
        () => {

            alert(
                "PDF generation will be added next."
            );

        }
    );

</script>

</body>
</html>
