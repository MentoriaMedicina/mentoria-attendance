<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Mentoria Medicina</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         ADMIN LOGIN
         ============================== -->

    <section id="loginSection" class="login-box">

        <h2>Admin Login</h2>

        <p class="login-subtitle">
            Mentoria Medicina Attendance
        </p>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button
            id="loginBtn"
            class="login-btn"
        >
            Login
        </button>

        <p id="loginMessage"></p>

    </section>


    <!-- ==============================
         ADMIN DASHBOARD
         ============================== -->

    <section
        id="adminDashboard"
        style="display:none;"
    >

        <header class="admin-header">

            <h1>Mentoria Medicina</h1>

            <p class="admin-subtitle">
                Attendance Admin Panel
            </p>

        </header>


        <main class="admin-container">

            <!-- ADMIN INFORMATION -->

            <div class="admin-user">

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

                <strong>Logged in as:</strong>

                <span id="adminEmail">
                    Admin
                </span>

            </div>


            <!-- FILTER -->

            <div class="admin-card">

                <h2>Attendance Report</h2>

                <div class="admin-filters">

                    <div>

                        <label for="groupFilter">
                            Group
                        </label>

                        <select id="groupFilter">

                            <option value="">
                                All Groups
                            </option>

                            <option value="7">
                                Group 7
                            </option>

                            <option value="9">
                                Group 9
                            </option>

                            <option value="10">
                                Group 10
                            </option>

                            <option value="11">
                                Group 11
                            </option>

                            <option value="12">
                                Group 12
                            </option>

                            <option value="13">
                                Group 13
                            </option>

                            <option value="15">
                                Group 15
                            </option>

                        </select>

                    </div>


                    <div>

                        <label for="dateFilter">
                            Date
                        </label>

                        <input
                            type="date"
                            id="dateFilter"
                        >

                    </div>

                </div>


                <button
                    id="viewBtn"
                    class="view-btn"
                >
                    View Attendance
                </button>

            </div>


            <!-- STATISTICS -->

            <div class="stats">

                <div class="stat">

                    <span
                        id="totalStudents"
                        class="stat-number"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Total Students
                    </span>

                </div>


                <div class="stat">

                    <span
                        id="absentCount"
                        class="stat-number"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Absent
                    </span>

                </div>


                <div class="stat">

                    <span
                        id="presentCount"
                        class="stat-number"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Present
                    </span>

                </div>

            </div>


            <!-- ABSENT LIST -->

            <div class="admin-card">

                <h2>
                    Absent Students
                </h2>

                <div id="absentList">

                    <div class="message">
                        Select a date and click
                        "View Attendance".
                    </div>

                </div>

                <button
                    id="pdfBtn"
                    class="pdf-btn"
                >
                    Download / Print Report
                </button>

            </div>

        </main>

    </section>


    <!-- IMPORTANT:
         Keep this BEFORE </body>
    -->

    <script type="module" src="admin.js"></script>

</body>
</html>
